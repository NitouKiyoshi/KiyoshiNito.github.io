<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Metronome App</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    margin: 0;
    background: #0f172a;
    color: white;
    text-align: center;
    font-size: 20px;
}

header {
    padding: 60px 20px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
    opacity: 0.9;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 24px;
    background: white;
    color: black;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
}

section {
    padding: 60px 20px;
}

.feature {
    max-width: 600px;
    margin: auto;
    text-align: left;
    line-height: 1.8;
}

footer {
    padding: 30px;
    font-size: 12px;
    opacity: 0.6;
}
</style>
</head>

<body>

<header>
    <h1>🎵 Metronome App</h1>
    <p>正確なリズムを、いつでもどこでも</p>
    <a class="btn"
       href="https://apps.apple.com/app/id6756605549"
       target="_blank">
       App Storeでダウンロード
    </a>
</header>

<section>
    <h2>📱 特徴</h2>
    <div class="feature">
        ✔ 高精度BPM（20〜300）対応<br>
        ✔ タップでテンポ設定<br>
        ✔ バックグラウンド再生<br>
        ✔ シンプルで見やすいUI
    </div>
</section>
<section>
  <h2>🎬 アプリ動作動画</h2>

  <video controls width="100%" style="max-width:500px; border-radius:12px;">
    <source src="movie2.mp4" type="video/mp4">
  </video>
</section>

<section style="background:#111827;">
    <h2>🎯 こんな人におすすめ</h2>
    <p>・楽器練習（ギター・ピアノ・ドラム）</p>
    <p>・バンド練習</p>
    <p>・リズムトレーニング</p>
</section>

<footer>
© 2026 Metronome App
</footer>

</body>
</html>
